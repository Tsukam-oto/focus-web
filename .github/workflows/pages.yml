name: Publish FOCUS (static)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: focus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Privacy-safe release validation
        run: python3 validate_release.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run all browser assertions
        run: |
          for test in tests/test_*.py; do python "$test"; done
      - name: JavaScript syntax checks
        run: |
          for source in public/*.js; do
            node --check "$source"
          done
  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./public
      - id: deployment
        uses: actions/deploy-pages@v4
